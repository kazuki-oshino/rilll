services:
  lgtm:
    image: grafana/otel-lgtm:latest
    container_name: rilll-otel-lgtm
    ports:
      - "127.0.0.1:3000:3000" # Grafana
      - "127.0.0.1:4317:4317" # OTLP/gRPC
      - "127.0.0.1:4318:4318" # OTLP/HTTP
    volumes:
      - lgtm-data:/data
    environment:
      ENABLE_LOGS_OTELCOL: "true"

volumes:
  lgtm-data:
